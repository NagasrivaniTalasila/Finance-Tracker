<div class="shell">
    <aside class="sidebar" [class.open]="mobileOpen()">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#04160d" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M2 12h20" />
                </svg>
            </span>
            <span class="brand-name">Expense Tracker</span>
        </div>

        <nav class="nav">
            <a *ngFor="let item of nav" [routerLink]="item.path" routerLinkActive="active" class="nav-item"
                (click)="closeMobile()"> <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
                    stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path [attr.d]="item.icon" />
                </svg>
                <span>{{ item.label }}</span> </a>
        </nav>
        <div class="sidebar-foot">
            <div class="promo card">
                <p class="promo-title" style="font-weight: 550;">Full Stack Application</p>
                <p class="promo-text">End-to-end application with live backend APIs, database integration, and real data
                    processing.</p>
            </div>
        </div>
    </aside>

    <div *ngIf="mobileOpen" class="scrim" (click)="closeMobile()"> </div>
    
    <div class="main">
        <header class="header">
            <button class="icon-btn burger" (click)="toggleMobile()" aria-label="Toggle navigation">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M3 6h18M3 12h18M3 18h18" />
                </svg>
            </button>

            <div class="header-title">
                <h1>{{ pageMeta().title }}</h1>
                <p>{{ pageMeta().subtitle }}</p>
            </div>

            <div class="header-actions">
                <button class="icon-btn" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" />
                    </svg>
                </button>
                <div class="user">
                    <span class="avatar">{{ initials() }}</span>
                    <span class="user-name">{{ user }}</span>
                </div>
                <button class="icon-btn" (click)="logout()" aria-label="Log out" title="Log out">
                    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="content">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
